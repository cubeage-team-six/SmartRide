name: Auto Merge to Development

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable Auto Merge
    runs-on: ubuntu-latest

    if: >
      github.event.pull_request.base.ref == 'Development' &&
      github.event.pull_request.draft == false &&
      (startsWith(github.event.pull_request.head.ref, 'dev-') || startsWith(github.event.pull_request.head.ref, 'devops-'))

    steps:
      - name: Debug Branch Names
        run: |
          echo "Target Branch (Base): ${{ github.event.pull_request.base.ref }}"
          echo "Source Branch (Head): ${{ github.event.pull_request.head.ref }}"
          echo "Is Draft: ${{ github.event.pull_request.draft }}"

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --auto \
            --squash \