name: Security Scan

on:
  push:
    branches:
      - Development

  pull_request:
    branches:
      - Development

jobs:
  frontend-security:
    name: Frontend Security Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: SmartRide-Frontend/VehicleRentalMobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SmartRide-Frontend/VehicleRentalMobile/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit --audit-level=high